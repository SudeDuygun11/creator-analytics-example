# • View: Virtual, zero-storage, fresh, slow. ->saved SQL query in bigquery
# • Table: Physical, fast, static, full-rebuild.
# • Incremental: Physical, appends-only, fast, cost-efficient.
# • Ephemeral: Text-only, CTE-injection, no-object, code-organizer. -->cannot have TESTS since it is not in bigquery Ephemeral models cannot carry generic tests such as unique, because they never exist as objects in BigQuery. If you want to test the intermediate model directly, switch it to view in its folder config.
# • Materialized View: Physical, auto-refreshing, background-managed, live-performance.

# +schema: staging controls where in BigQuery the results of your SQL models are created.
# Take models/staging/stg_payments.sql. When you run dbt build, dbt turns that SQL into a view in BigQuery

name: creator_analytics          # must match the key under "models:" below
version: "1.0.0"
profile: default                 # ignored by the dbt platform, which uses your connection

model-paths: ["models"]
test-paths: ["tests"]

vars:
  platform_fee_rate: 0.10        # the single place the fee is defined

models:
  creator_analytics:
    staging:
      +materialized: view        # cheap, always reflects raw data
      +schema: staging           # lands in dbt_sduygun_staging during development
    intermediate:
      +materialized: ephemeral   # not built in BigQuery, inlined into the models that use it
    marts:
      +materialized: table       # what Looker reads, so stored physically
      +schema: marts             # lands in dbt_sduygun_marts during development
    reporting:
      +materialized: view        # cheap, and date-based flags use today's date at query time
      +schema: reporting         # lands in dbt_sduygun_reporting during development
