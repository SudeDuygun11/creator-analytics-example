models:
  - name: stg_payments
    description: One row per payment, deduplicated on payment_id.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: creator_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["succeeded", "failed"]

  - name: stg_refunds
    description: One row per refund.
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: payment_id
        data_tests: [not_null]

  - name: stg_creators
    description: One row per creator.
    columns:
      - name: creator_id
        data_tests: [unique, not_null]
      - name: plan
        data_tests:
          - accepted_values:
              arguments:
                values: ["basic", "pro"]
